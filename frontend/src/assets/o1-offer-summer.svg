<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#80DEEA" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  
  <!-- Sun -->
  <circle cx="500" cy="100" r="60" fill="#FFF59D" opacity="0.8" />
  
  <!-- Artisan Ice Creams -->
  <path d="M150 250 L200 350 L250 250 Z" fill="#FFCC80" /> <!-- Cone -->
  <circle cx="200" cy="230" r="45" fill="#F48FB1" />
  <circle cx="200" cy="170" r="40" fill="#CE93D8" />

  <path d="M350 250 L400 350 L450 250 Z" fill="#FFCC80" /> <!-- Cone -->
  <circle cx="400" cy="230" r="45" fill="#C5E1A5" />
  <circle cx="400" cy="170" r="40" fill="#FFF59D" />

  <!-- Floral/Berry Accents -->
  <circle cx="140" cy="200" r="15" fill="#E91E63" />
  <circle cx="260" cy="180" r="10" fill="#9C27B0" />
  <circle cx="340" cy="210" r="12" fill="#8BC34A" />
  <circle cx="460" cy="160" r="14" fill="#FFEB3B" />
  
  <!-- Banner Text Backing -->
  <rect x="50" y="30" width="300" height="50" rx="25" fill="#fff" opacity="0.9" />
  <text x="200" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#00838F" text-anchor="middle">SUMMER FEST</text>
</svg>
